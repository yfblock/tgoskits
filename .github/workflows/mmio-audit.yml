name: MMIO audit

# Runs the CodeQL MMIO read/write audit (codeql/mmio-audit) and uploads the
# findings as SARIF to the repository's "Security" tab. Any new hand-rolled
# `read_volatile` / `write_volatile` register access outside the canonical
# `mmio-api` crate shows up as a result here.
#
# The queries depend on `codeql/rust-all`. The CodeQL CLI bundle from
# github/codeql-cli-binaries ships only the Rust *extractor* (no Rust query
# library), and the library bundled with github/codeql-action is incomplete in
# 2.26.0 (its `codeql/rust-all` references a `codeql/namebinding` that is not
# shipped). We therefore drive `codeql` directly: the CLI bundle for the
# extractor, plus a version-matched sparse checkout of github/codeql for the
# `codeql/rust-all` query library (resolved via --search-path).
#
# A build is required: a no-build database misses several crates that contain
# ad-hoc MMIO access (sdhci-cv1800, arm-gic-driver, dwmmc-host, ...), so
# `cargo build -p mmio-api` is run under the extractor for full workspace
# source coverage.

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "codeql/**"
      - ".github/workflows/mmio-audit.yml"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - "**/*.rs"
      - "codeql/**"
      - ".github/workflows/mmio-audit.yml"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  mmio-audit:
    name: CodeQL MMIO read/write audit
    runs-on: ubuntu-latest
    env:
      CODEQL_VERSION: "2.26.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache CodeQL CLI bundle
        id: cache-codeql
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/codeql
          key: codeql-cli-linux64-${{ env.CODEQL_VERSION }}

      - name: Download CodeQL CLI bundle
        if: steps.cache-codeql.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/codeql.zip \
            "https://github.com/github/codeql-cli-binaries/releases/download/v${CODEQL_VERSION}/codeql-linux64.zip"
          unzip -q /tmp/codeql.zip -d "$RUNNER_TEMP"

      - name: Add CodeQL to PATH
        run: echo "$RUNNER_TEMP/codeql" >> "$GITHUB_PATH"

      - name: Fetch codeql/rust-all source library (version-matched)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "codeql-cli/v${CODEQL_VERSION}" \
            https://github.com/github/codeql.git "$RUNNER_TEMP/codeql-src"
          cd "$RUNNER_TEMP/codeql-src"
          git sparse-checkout set rust/ql/lib rust/ql/src shared

      - name: Build CodeQL database (intercepting cargo build)
        run: |
          codeql database create "$RUNNER_TEMP/mmio-db" \
            --language=rust \
            --source-root=. \
            --command="cargo build -p mmio-api" \
            --overwrite

      - name: Run MMIO audit queries
        run: |
          codeql database analyze "$RUNNER_TEMP/mmio-db" \
            codeql/mmio-audit/AdHocVolatileRegisterAccess.ql \
            codeql/mmio-audit/InlineAsmRegisterAccess.ql \
            --search-path="$RUNNER_TEMP/codeql-src" \
            --format=sarif-latest \
            --output="$RUNNER_TEMP/mmio-audit.sarif"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/mmio-audit.sarif
          category: mmio-audit

      - name: Fail only on newly-introduced ad-hoc MMIO access
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Only block on ad-hoc MMIO access introduced by THIS change (lines
          # added vs the base ref), not on the pre-existing backlog. SARIF is
          # already uploaded above, so all findings remain reviewable.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against (first push); skipping new-code check."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          python3 codeql/mmio-audit/fail-on-new.py "$RUNNER_TEMP/mmio-audit.sarif" "$BASE_SHA"
